<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba 18 · Shader + sprites pixel art (pixi)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a120a; overflow:hidden; font-family: ui-monospace, Menlo, monospace; color:#dfeacf; }
  #app canvas { display:block; width:100vw !important; height:100vh !important; image-rendering: pixelated; }
  #overlay {
    position: fixed; inset: 0; background: rgba(8,12,8,.86); backdrop-filter: blur(6px);
    display: grid; place-items: center; cursor: pointer; z-index: 10; transition: opacity .4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay .card { text-align:center; padding:2rem 3rem; border:1px solid #3a5a3a; background:#0e140e; }
  #overlay h1 { margin:0 0 .8rem; font-size:1rem; letter-spacing:.2em; }
  #overlay p { margin:.2rem 0; font-size:.8rem; opacity:.7; }
  #hud { position: fixed; left:12px; bottom:10px; font-size:11px; opacity:.6; z-index:5; text-shadow: 0 1px 0 #000; }
  #hud button { background:#0e140e; color:#dfeacf; border:1px solid #3a5a3a; font:inherit; padding:4px 8px; margin-left:6px; cursor:pointer; }
  #hud button:hover { background:#1c2a1c; }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay">
  <div class="card">
    <h1>PRUEBA 18 — SHADER + SPRITES</h1>
    <p>híbrido: terreno GLSL + casitas pixel art encima</p>
    <p>click para empezar</p>
  </div>
</div>
<div id="hud">
  seed <span id="seedView">—</span>
  <button id="reseed">nuevo seed</button>
  <button id="mute">mute</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js"></script>
<script>
/* ============================================================
   Pixi.js v7 + custom GLSL shader rendering the entire scene.
   Top-down stylised landscape: pixel-quantised noise terrain,
   animated wind sway on grass, flowing water, drifting clouds.
   ============================================================ */

const vert = /* glsl */`
  precision mediump float;
  attribute vec2 aVertexPosition;
  attribute vec2 aUvs;
  uniform mat3 projectionMatrix;
  varying vec2 vUvs;
  void main(){
    vUvs = aUvs;
    gl_Position = vec4((projectionMatrix * vec3(aVertexPosition, 1.0)).xy, 0.0, 1.0);
  }
`;

const frag = /* glsl */`
  precision highp float;
  varying vec2 vUvs;
  uniform vec2  uRes;
  uniform float uTime;
  uniform float uSeed;
  uniform float uPixel;   // pixel chunkiness
  uniform float uWind;    // wind intensity 0..1

  // ----- hash & noise (Inigo Quilez style, value noise + fbm) -----
  float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21) + uSeed);
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float vnoise(vec2 p){
    vec2 i = floor(p);
    vec2 f = fract(p);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0,0.0));
    float c = hash21(i + vec2(0.0,1.0));
    float d = hash21(i + vec2(1.0,1.0));
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
  }
  float fbm(vec2 p){
    float v = 0.0; float a = 0.5;
    mat2 rot = mat2(0.8, -0.6, 0.6, 0.8);
    for (int i = 0; i < 5; i++){
      v += a * vnoise(p);
      p = rot * p * 2.02;
      a *= 0.5;
    }
    return v;
  }
  // ridged for rivers
  float ridge(vec2 p){ return 1.0 - abs(fbm(p)*2.0 - 1.0); }

  vec3 paletteGrass(float t){
    // limited palette grading by lightness
    vec3 c1 = vec3(0.13,0.27,0.10);
    vec3 c2 = vec3(0.18,0.36,0.13);
    vec3 c3 = vec3(0.28,0.50,0.20);
    vec3 c4 = vec3(0.42,0.66,0.27);
    vec3 c5 = vec3(0.56,0.78,0.36);
    if (t < 0.2) return c1;
    if (t < 0.45) return c2;
    if (t < 0.7) return c3;
    if (t < 0.88) return c4;
    return c5;
  }

  void main(){
    vec2 fragCoord = vUvs * uRes;
    // quantise to pixel grid (chunky Sims-like look)
    vec2 p = floor(fragCoord / uPixel) * uPixel;
    vec2 uv = p / uRes;
    // world coordinates: keep aspect ratio
    vec2 w = (p - uRes*0.5) / uRes.y;

    // ---- WIND distortion (only applied to grass UVs) ----
    float t = uTime;
    vec2 windOff = vec2(
      fbm(w * 3.0 + t * 0.35),
      fbm(w * 3.0 + vec2(11.3, -7.1) + t * 0.35)
    ) * 0.012 * uWind;

    // ---- terrain field ----
    vec2 wp = w * 2.6 + windOff;
    float continent = fbm(wp * 0.7 + vec2(uSeed*0.013, -uSeed*0.007));
    float rivers = ridge(w * 2.2 + vec2(uSeed*0.0091, uSeed*0.011));
    float moisture = fbm(w * 1.4 + vec2(2.3, -5.1));

    // ---- classify ----
    bool isRiver = rivers > 0.92 + moisture*0.02;
    bool isDeep  = rivers > 0.965;
    bool isShore = rivers > 0.89 && rivers <= 0.92;

    vec3 col;
    if (isDeep){
      // deep water — animate flow
      float flow = fbm(w * 6.0 + vec2(t*0.3, t*0.15));
      col = mix(vec3(0.07,0.18,0.34), vec3(0.10,0.24,0.43), flow);
      // sparkle
      float sp = pow(hash21(p + floor(t*4.0)), 50.0);
      col += sp * 0.6;
    } else if (isRiver){
      float flow = fbm(w * 8.0 + vec2(t*0.5, t*0.25));
      col = mix(vec3(0.13,0.30,0.50), vec3(0.27,0.51,0.69), flow);
      float sp = pow(hash21(p + floor(t*6.0)), 30.0);
      col += sp * 0.4;
    } else if (isShore){
      // sand — dithered between 2 tones
      float d = step(0.5, hash21(p*0.5));
      col = mix(vec3(0.71,0.61,0.39), vec3(0.85,0.74,0.50), d);
    } else {
      // GRASS — sample tone by combined noise, dither for pixel art feel
      float tone = clamp(continent*0.5 + moisture*0.5 + 0.05, 0.0, 1.0);
      // small dithered variation per pixel
      float n = hash21(p);
      tone += (n - 0.5) * 0.08;
      col = paletteGrass(tone);

      // sparse "flowers" as colored specks
      float fl = hash21(p + vec2(0.7, 1.3));
      if (fl > 0.997){
        col = mix(col, vec3(0.95,0.95,0.85), 0.85);   // white flower
      } else if (fl > 0.993){
        col = mix(col, vec3(0.92,0.78,0.30), 0.7);    // yellow
      } else if (fl > 0.990){
        col = mix(col, vec3(0.85,0.32,0.32), 0.7);    // red
      }
      // tree clusters: gated by a second noise
      float tree = fbm(w * 5.0 + vec2(5.2, -1.7));
      if (tree > 0.62){
        float canopy = fbm(w * 14.0);
        if (canopy > 0.52){
          // dark green canopy
          col = mix(col, vec3(0.16,0.27,0.13), 0.85);
          // canopy highlight
          if (canopy > 0.66) col = mix(col, vec3(0.30,0.50,0.20), 0.5);
        }
      }
    }

    // soft dappled shadows from imaginary canopy
    float shade = fbm(w*1.6 + vec2(0.0, t*0.05));
    col *= 0.85 + shade * 0.25;

    // vignette
    float vig = smoothstep(1.2, 0.4, length(vUvs - 0.5));
    col *= mix(0.78, 1.0, vig);

    gl_FragColor = vec4(col, 1.0);
  }
`;

const app = new PIXI.Application({
  resizeTo: window,
  background: 0x0a120a,
  antialias: false,
  resolution: 1,
});
document.getElementById('app').appendChild(app.view);
app.view.style.imageRendering = 'pixelated';

const geometry = new PIXI.Geometry()
  .addAttribute('aVertexPosition', [-1,-1, 1,-1, 1,1, -1,1], 2)
  .addAttribute('aUvs', [0,0, 1,0, 1,1, 0,1], 2)
  .addIndex([0,1,2, 0,2,3]);

let currentSeed = Math.floor(Math.random()*1000);
const uniforms = {
  uRes:   [window.innerWidth, window.innerHeight],
  uTime:  0,
  uSeed:  currentSeed,
  uPixel: 4.0,
  uWind:  0.5,
};
const shader = PIXI.Shader.from(vert, frag, uniforms);

// full-screen quad scaled to window
const quad = new PIXI.Mesh(geometry, shader);
quad.position.set(0, 0);
function setQuadSize(){
  quad.scale.set(window.innerWidth, window.innerHeight);
  uniforms.uRes[0] = window.innerWidth;
  uniforms.uRes[1] = window.innerHeight;
}
setQuadSize();
quad.position.set(0, 0);
// our vertices are -1..1 — easier: just stretch via app
app.stage.addChild(quad);
// reset transform — use a different approach: render full-screen using vertices directly in screen space
// rebuild geometry to use screen-space vertices
function buildFullScreenGeom(){
  const w = window.innerWidth, h = window.innerHeight;
  return new PIXI.Geometry()
    .addAttribute('aVertexPosition', [0,0, w,0, w,h, 0,h], 2)
    .addAttribute('aUvs', [0,0, 1,0, 1,1, 0,1], 2)
    .addIndex([0,1,2, 0,2,3]);
}
app.stage.removeChild(quad);
const quad2 = new PIXI.Mesh(buildFullScreenGeom(), shader);
app.stage.addChild(quad2);

let t0 = performance.now();
app.ticker.add(() => {
  uniforms.uTime = (performance.now() - t0) / 1000;
  uniforms.uWind = 0.45 + 0.35 * Math.sin(uniforms.uTime * 0.13);
});

window.addEventListener('resize', () => {
  app.renderer.resize(window.innerWidth, window.innerHeight);
  app.stage.removeChild(quad2);
  quad2.geometry.destroy();
  quad2.geometry = buildFullScreenGeom();
  app.stage.addChildAt(quad2, 0);   // siempre por debajo de sprites
  uniforms.uRes[0] = window.innerWidth;
  uniforms.uRes[1] = window.innerHeight;
  placeBuildings();
});

document.getElementById('seedView').textContent = currentSeed;

/* ============================================================
   SPRITES de edificios romanos (pixel art) encima del terreno.
   El shader pinta el fondo; aquí spawneamos casitas en posiciones
   "habitables" reusando el mismo noise del shader (portado a JS).
   ============================================================ */
function jsHash21(px, py, seed){
  let x = px * 123.34 + seed;
  let y = py * 456.21 + seed;
  x = x - Math.floor(x);
  y = y - Math.floor(y);
  const dot = x*(x+45.32) + y*(y+45.32);
  x += dot; y += dot;
  const r = x * y;
  return r - Math.floor(r);
}
function jsVnoise(px, py, seed){
  const ix = Math.floor(px), iy = Math.floor(py);
  const fx = px - ix, fy = py - iy;
  const a = jsHash21(ix, iy, seed);
  const b = jsHash21(ix+1, iy, seed);
  const c = jsHash21(ix, iy+1, seed);
  const d = jsHash21(ix+1, iy+1, seed);
  const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
  return a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy;
}
function jsFbm(px, py, seed){
  let v = 0, a = 0.5;
  for (let i = 0; i < 5; i++){
    v += a * jsVnoise(px, py, seed);
    const nx = (0.8*px - 0.6*py) * 2.02;
    const ny = (0.6*px + 0.8*py) * 2.02;
    px = nx; py = ny;
    a *= 0.5;
  }
  return v;
}
function jsRidge(px, py, seed){ return 1 - Math.abs(jsFbm(px, py, seed)*2 - 1); }

// Texturas reutilizables (se crean 1 vez, se instancian N veces)
function makeHouseCanvas(variant){
  const W = 28, H = 32;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  // sombra elíptica abajo
  g.fillStyle = 'rgba(0,0,0,.32)';
  g.beginPath(); g.ellipse(W/2, H-3, 11, 3, 0, 0, Math.PI*2); g.fill();
  // muros: caja con perspectiva isométrica (2 caras visibles)
  const baseY = H - 5;
  const wallH = variant === 'insula' ? 18 : 14;
  const halfW = 11;
  // pared izq (sombra)
  g.fillStyle = '#a89878';
  g.fillRect(W/2 - halfW, baseY - wallH, halfW, wallH);
  // pared der (luz)
  g.fillStyle = '#d8c8a8';
  g.fillRect(W/2, baseY - wallH, halfW, wallH);
  // borde central + esquinas
  g.fillStyle = '#6a5a40';
  g.fillRect(W/2 - halfW - 1, baseY - wallH, 1, wallH);
  g.fillRect(W/2 + halfW, baseY - wallH, 1, wallH);
  g.fillRect(W/2, baseY - wallH, 1, wallH);
  // puerta
  g.fillStyle = '#3a1f0e';
  g.fillRect(W/2 + 3, baseY - 5, 2, 5);
  // ventanas
  g.fillStyle = '#2a2c1a';
  if (variant === 'insula'){
    g.fillRect(W/2 - 7, baseY - wallH + 2, 2, 2);
    g.fillRect(W/2 - 7, baseY - wallH + 7, 2, 2);
    g.fillRect(W/2 - 7, baseY - wallH + 12, 2, 2);
    g.fillRect(W/2 + 3, baseY - wallH + 2, 2, 2);
    g.fillRect(W/2 + 3, baseY - wallH + 7, 2, 2);
  } else {
    g.fillRect(W/2 - 6, baseY - wallH + 3, 2, 2);
  }
  // tejado a dos aguas
  const ridgeY = baseY - wallH - 7;
  const hRoof = 7;
  // lado oscuro
  g.fillStyle = '#883020';
  for (let dy = 0; dy < hRoof; dy++){
    const y = ridgeY + dy;
    const w = Math.floor((dy + 1) / hRoof * (halfW + 2));
    g.fillRect(W/2 - w, y, w, 1);
  }
  // lado claro
  g.fillStyle = '#c44a32';
  for (let dy = 0; dy < hRoof; dy++){
    const y = ridgeY + dy;
    const w = Math.floor((dy + 1) / hRoof * (halfW + 2));
    g.fillRect(W/2, y, w, 1);
  }
  // cumbrera
  g.fillStyle = '#5a1c14';
  g.fillRect(W/2 - 1, ridgeY, 2, 1);
  return c;
}
let houseTex = PIXI.Texture.from(makeHouseCanvas('domus'));
let insulaTex = PIXI.Texture.from(makeHouseCanvas('insula'));

const spritesLayer = new PIXI.Container();
app.stage.addChild(spritesLayer);

// Coloca casitas en zonas grass altas. Muestrea un grid jittereado.
function placeBuildings(){
  spritesLayer.removeChildren();
  const W = window.innerWidth, H = window.innerHeight;
  const ROWS = Math.max(5, Math.floor(H / 80));
  const COLS = Math.max(6, Math.floor(W / 80));
  const ASPECT_Y = H;
  const seed = currentSeed * 0.013;
  for (let j = 0; j < ROWS; j++){
    for (let i = 0; i < COLS; i++){
      // posición jittereada determinista por (i,j,seed)
      const jx = jsHash21(i, j*7+1, currentSeed);
      const jy = jsHash21(i*5+2, j, currentSeed);
      const px = (i + jx * 0.85) / COLS * W;
      const py = (j + jy * 0.85) / ROWS * H;
      // a coords del shader (w = (p - res/2) / res.y)
      const wx = (px - W*0.5) / ASPECT_Y;
      const wy = (py - H*0.5) / ASPECT_Y;
      // mismo terrain field que el shader
      const wp = [wx * 2.6, wy * 2.6];
      const continent = jsFbm(wp[0]*0.7 + currentSeed*0.013, wp[1]*0.7 - currentSeed*0.007, currentSeed);
      const rivers = jsRidge(wx*2.2 + currentSeed*0.0091, wy*2.2 + currentSeed*0.011, currentSeed);
      if (rivers > 0.89) continue;          // río/shore: skip
      if (continent < 0.40) continue;       // zona baja
      // selección de variante: insula con menor probabilidad
      const r = jsHash21(i*11, j*13, currentSeed);
      const tex = r < 0.25 ? insulaTex : houseTex;
      const sp = new PIXI.Sprite(tex);
      sp.anchor.set(0.5, 1.0);
      sp.position.set(px, py);
      // escala pixel art: 1x es chico, 2x razonable para visibilidad
      sp.scale.set(2, 2);
      spritesLayer.addChild(sp);
    }
  }
  // ordenar por Y para que los de detrás queden detrás
  spritesLayer.children.sort((a, b) => a.position.y - b.position.y);
}
placeBuildings();

document.getElementById('reseed').addEventListener('click', () => {
  currentSeed = Math.floor(Math.random()*1000);
  uniforms.uSeed = currentSeed;
  document.getElementById('seedView').textContent = currentSeed;
  placeBuildings();
});

/* ============================================================
   Procedural ambient audio: wind that breathes with shader's
   uWind uniform; bubbling water; occasional bird chirps.
   ============================================================ */
class Ambient {
  constructor(){ this.ac = null; this.master = null; this.muted = false; }
  start(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ac = new AC(); const ac = this.ac;
    this.master = ac.createGain(); this.master.gain.value = 0;
    this.master.connect(ac.destination);
    this.master.gain.linearRampToValueAtTime(0.6, ac.currentTime + 1.2);

    // pink-ish wind
    const bufSize = 2 * ac.sampleRate;
    const wbuf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const wd = wbuf.getChannelData(0);
    let b0=0,b1=0,b2=0;
    for (let i=0;i<bufSize;i++){
      const w = Math.random()*2-1;
      b0 = 0.99765*b0 + w*0.0990460;
      b1 = 0.96300*b1 + w*0.2965164;
      b2 = 0.57000*b2 + w*1.0526913;
      wd[i] = (b0+b1+b2 + w*0.1848)*0.07;
    }
    const w = ac.createBufferSource(); w.buffer = wbuf; w.loop = true;
    const wlp = ac.createBiquadFilter(); wlp.type='lowpass'; wlp.frequency.value = 600;
    this.windGain = ac.createGain(); this.windGain.gain.value = .25;
    w.connect(wlp).connect(this.windGain).connect(this.master); w.start();

    // bubbling water: brown noise bandpassed, fast LFO
    const bbuf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const bd = bbuf.getChannelData(0); let last=0;
    for (let i=0;i<bufSize;i++){ const x=Math.random()*2-1; last=(last+0.02*x)/1.02; bd[i]=last*3.5; }
    const b = ac.createBufferSource(); b.buffer = bbuf; b.loop = true;
    const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=.9;
    const bg = ac.createGain(); bg.gain.value=.40;
    const lfo = ac.createOscillator(); lfo.frequency.value=.18;
    const lfoG = ac.createGain(); lfoG.gain.value = 220;
    lfo.connect(lfoG).connect(bp.frequency); lfo.start();
    b.connect(bp).connect(bg).connect(this.master); b.start();

    // bird chirps — pure sinewaves with quick frequency glide
    const bird = () => {
      if (!this.ac) return;
      if (!this.muted){
        const t = ac.currentTime;
        const base = 1800 + Math.random()*1400;
        const reps = 2 + Math.floor(Math.random()*3);
        for (let k=0;k<reps;k++){
          const t2 = t + k*0.10;
          const o = ac.createOscillator(); o.type='sine';
          o.frequency.setValueAtTime(base, t2);
          o.frequency.exponentialRampToValueAtTime(base*1.4, t2+.06);
          o.frequency.exponentialRampToValueAtTime(base*0.9, t2+.12);
          const g = ac.createGain();
          g.gain.setValueAtTime(0, t2);
          g.gain.linearRampToValueAtTime(.05, t2+.01);
          g.gain.exponentialRampToValueAtTime(.0001, t2+.12);
          o.connect(g).connect(this.master);
          o.start(t2); o.stop(t2+.14);
        }
      }
      setTimeout(bird, 2500 + Math.random()*4000);
    };
    setTimeout(bird, 1500);

    // wire wind to shader uniform
    setInterval(() => {
      if (this.windGain && uniforms){
        const target = 0.12 + 0.30 * uniforms.uWind;
        this.windGain.gain.linearRampToValueAtTime(target, ac.currentTime + 0.3);
      }
    }, 250);
  }
  toggleMute(){
    if (!this.ac) return;
    this.muted = !this.muted;
    this.master.gain.cancelScheduledValues(this.ac.currentTime);
    this.master.gain.linearRampToValueAtTime(this.muted ? 0 : 0.6, this.ac.currentTime + .4);
  }
}
const ambient = new Ambient();

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => { overlay.classList.add('hidden'); ambient.start(); });
document.getElementById('mute').addEventListener('click', e => {
  ambient.toggleMute(); e.target.textContent = ambient.muted ? 'unmute' : 'mute';
});
</script>
</body>
</html>
