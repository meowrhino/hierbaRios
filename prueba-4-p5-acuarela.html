<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba 4 · p5.js acuarela</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f3ead7; overflow:hidden; font-family: ui-monospace, Menlo, monospace; color:#3a3528; }
  canvas { display:block; }
  #overlay {
    position: fixed; inset: 0; background: rgba(243,234,215,.92); backdrop-filter: blur(4px);
    display: grid; place-items: center; cursor: pointer; z-index: 10; transition: opacity .4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay .card { text-align:center; padding:2rem 3rem; border:1px solid #b6a275; background:#fbf6ea; }
  #overlay h1 { margin:0 0 .8rem; font-size:1rem; letter-spacing:.2em; color:#5a4d2c; }
  #overlay p { margin:.2rem 0; font-size:.8rem; opacity:.7; }
  #hud { position: fixed; left:12px; bottom:10px; font-size:11px; opacity:.7; z-index:5; color:#5a4d2c; }
  #hud button { background:#fbf6ea; color:#5a4d2c; border:1px solid #b6a275; font:inherit; padding:4px 8px; margin-left:6px; cursor:pointer; }
  #hud button:hover { background:#efe6cf; }
</style>
</head>
<body>
<div id="overlay">
  <div class="card">
    <h1>PRUEBA 4 — ACUARELA</h1>
    <p>p5.js · pinceladas · ríos aguados</p>
    <p>click para empezar</p>
  </div>
</div>
<div id="hud">
  seed <span id="seedView">—</span>
  <button id="reseed">nuevo seed</button>
  <button id="mute">mute</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.10.0/lib/p5.min.js"></script>
<script>
/* ============================================================
   p5.js · acuarela painterly: capas con baja alpha, bordes
   jitterados, mancha de color tipo lavado de aguada, ríos como
   bezier con bleed. Audio: drone + agua.
   ============================================================ */

let SEED;
const noiseScale = 0.0034;
const moisScale = 0.006;

function mulberry32(seed){ let s=seed>>>0; return () => { s=(s+0x6D2B79F5)|0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }

let rng;

const PALETTE = {
  paper:   '#f3ead7',
  paperDk: '#e8dec2',
  grass1:  '#4a6a3a',
  grass2:  '#5e864a',
  grass3:  '#7da855',
  grass4:  '#a4c66c',
  shadow:  '#384c25',
  river1:  '#5781a4',
  river2:  '#7ea6c4',
  river3:  '#a8c5d8',
  sand:    '#d6c089',
  treeDk:  '#2c4d22',
  treeMid: '#3c6a2c',
  treeLi:  '#5e944a',
  trunk:   '#4a311e',
  flowerR: '#c8523a',
  flowerY: '#d8b34c',
  flowerW: '#f0eadc',
};

function setup(){
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  createCanvas(window.innerWidth, window.innerHeight);
  noLoop();
  redraw();
}

function regenerate(seed){
  SEED = seed;
  document.getElementById('seedView').textContent = SEED;
  noiseSeed(SEED);
  randomSeed(SEED);
  rng = mulberry32(SEED);
  redraw();
}

function paperTexture(){
  // grain via low-alpha specks
  noStroke();
  for (let k=0;k<3500;k++){
    const x = random(width), y = random(height);
    const a = random(8, 22);
    fill(255, 230, 200, a);
    rect(x, y, 1.4, 1.4);
  }
  // soft warm vignette
  for (let r=0; r<360; r+=30){
    push();
    translate(width/2, height/2);
    rotate(radians(r));
    noFill();
    for (let q=0;q<10;q++){
      stroke(80, 60, 30, 4);
      strokeWeight(2);
      const rd = max(width, height) * (0.55 + q*0.03);
      arc(0, 0, rd*2, rd*2, -0.3, 0.3);
    }
    pop();
  }
}

// -------- watercolor blob: deformed polygon, multiple low-alpha passes --------
function watercolorBlob(cx, cy, r, col, opts={}){
  const {
    layers = 5,          // overlapping passes
    deform = 0.42,       // shape irregularity
    edgeNoise = 0.85,    // edge jitter
    bleed = 0.18,        // outer bleed
    seedOff = 0,
  } = opts;
  const verts = 26;
  // base shape
  const baseR = [];
  for (let i=0;i<verts;i++){
    const a = (i/verts) * TWO_PI;
    const n = noise(cx*0.01 + cos(a)*0.5 + seedOff, cy*0.01 + sin(a)*0.5 + seedOff);
    baseR.push(r * (1 - deform*0.5 + n*deform));
  }
  // shape passes
  for (let L=0; L<layers; L++){
    const f = 1 + L*0.04;
    const alpha = (L === 0 ? 48 : 22) - L*2;
    const c = color(col);
    c.setAlpha(max(8, alpha));
    fill(c);
    noStroke();
    beginShape();
    for (let i=0;i<verts;i++){
      const a = (i/verts) * TWO_PI;
      const jitter = (noise(cx*0.02+L*7+i*0.4, cy*0.02-L*3+i*0.2) - .5) * r * edgeNoise * 0.04 * (L+1);
      const rr = baseR[i] * f + jitter;
      vertex(cx + cos(a)*rr, cy + sin(a)*rr);
    }
    endShape(CLOSE);
  }
  // outer bleed: darker, very low-alpha, slightly larger
  const cb = color(col); cb.setAlpha(14);
  fill(cb); noStroke();
  beginShape();
  for (let i=0;i<verts;i++){
    const a = (i/verts) * TWO_PI;
    const jitter = (noise(cx*0.03+i*0.7, cy*0.03+i*0.5) - .5) * r * 0.35;
    const rr = baseR[i] * (1 + bleed) + jitter;
    vertex(cx + cos(a)*rr, cy + sin(a)*rr);
  }
  endShape(CLOSE);
}

// -------- short brush stroke (a tapered ellipse path) --------
function brushStroke(x1,y1,x2,y2, col, w, alpha=70){
  const c = color(col); c.setAlpha(alpha);
  stroke(c);
  noFill();
  strokeWeight(w);
  strokeJoin(ROUND); strokeCap(ROUND);
  // small wiggle along path
  const segments = 8;
  beginShape();
  for (let i=0;i<=segments;i++){
    const t = i/segments;
    const px = lerp(x1, x2, t);
    const py = lerp(y1, y2, t);
    const nx = (noise(px*0.06+SEED, py*0.06)-.5) * w * 0.5;
    const ny = (noise(px*0.06+SEED+99, py*0.06)-.5) * w * 0.5;
    curveVertex(px+nx, py+ny);
  }
  endShape();
}

// -------- river path: derive a winding centerline from noise field, draw with watercolor passes --------
function drawRiver(){
  // start point on edge, walk via noise gradient until exits
  const startSide = floor(random(4));
  let x, y, dx, dy;
  if (startSide===0){ x=random(width); y=-20; dx=0; dy=1; }
  else if (startSide===1){ x=width+20; y=random(height); dx=-1; dy=0; }
  else if (startSide===2){ x=random(width); y=height+20; dx=0; dy=-1; }
  else { x=-20; y=random(height); dx=1; dy=0; }

  const path = [{x,y}];
  for (let step=0; step<400; step++){
    // turn gradually using noise
    const ang = noise(x*0.003, y*0.003, SEED*0.01) * TWO_PI * 2;
    const tx = cos(ang), ty = sin(ang);
    // bias toward center
    const toCx = (width/2 - x), toCy = (height/2 - y);
    const cm = sqrt(toCx*toCx+toCy*toCy) + 0.001;
    const cb = (step < 80) ? 0.35 : 0.05;
    dx = lerp(dx, tx*0.8 + (toCx/cm)*cb, 0.12);
    dy = lerp(dy, ty*0.8 + (toCy/cm)*cb, 0.12);
    const m = sqrt(dx*dx+dy*dy)+0.001;
    dx /= m; dy /= m;
    x += dx * 8;
    y += dy * 8;
    path.push({x,y});
    if (x<-30 || y<-30 || x>width+30 || y>height+30) break;
  }
  if (path.length < 4) return;

  // draw river: multiple overlapping watercolor passes along the path
  // 1) wide pale bleed
  noFill();
  stroke(color(PALETTE.river3 + '40'));
  strokeWeight(38);
  drawCurveAlong(path, 3);
  // 2) mid wash
  stroke(color(PALETTE.river2 + '66'));
  strokeWeight(22);
  drawCurveAlong(path, 2);
  // 3) deeper core
  stroke(color(PALETTE.river1 + '90'));
  strokeWeight(11);
  drawCurveAlong(path, 1.4);
  // 4) speckle highlight
  noStroke();
  for (let i=0;i<path.length-2;i+=1){
    const p = path[i];
    const c = color(255,255,255, 38);
    fill(c);
    ellipse(p.x + (rng()-.5)*8, p.y + (rng()-.5)*8, 4, 1.6);
  }
  // 5) sandy edges (yellowish dots near riverbank)
  noStroke();
  for (let i=0;i<path.length;i+=2){
    const p = path[i];
    for (let k=0;k<6;k++){
      const ang = rng()*TWO_PI;
      const rd = 15 + rng()*9;
      const sx = p.x + cos(ang)*rd, sy = p.y + sin(ang)*rd;
      const c = color(PALETTE.sand);
      c.setAlpha(35 + rng()*25);
      fill(c);
      ellipse(sx, sy, 3 + rng()*2, 3 + rng()*2);
    }
  }
}
function drawCurveAlong(path, jitter){
  beginShape();
  curveVertex(path[0].x, path[0].y);
  for (const p of path){
    const jx = (noise(p.x*0.02, p.y*0.02)-.5)*jitter*4;
    const jy = (noise(p.x*0.02+9, p.y*0.02+9)-.5)*jitter*4;
    curveVertex(p.x+jx, p.y+jy);
  }
  curveVertex(path[path.length-1].x, path[path.length-1].y);
  endShape();
}

// -------- terrain washes: large grass blobs over the canvas --------
function drawGrassWashes(){
  // gridded sample of biome via noise
  const cols = 16, rows = 11;
  const dw = width / cols, dh = height / rows;
  for (let j=0;j<rows;j++){
    for (let i=0;i<cols;i++){
      const cx = i*dw + dw*0.5 + (rng()-.5)*dw*0.5;
      const cy = j*dh + dh*0.5 + (rng()-.5)*dh*0.5;
      const n = noise(cx*noiseScale, cy*noiseScale);
      const m = noise(cx*moisScale+11, cy*moisScale-3);
      const tone = (n*0.6 + m*0.4);
      let col;
      if (tone < 0.38) col = PALETTE.grass1;
      else if (tone < 0.52) col = PALETTE.grass2;
      else if (tone < 0.68) col = PALETTE.grass3;
      else col = PALETTE.grass4;
      const r = dw * (0.65 + rng()*0.45);
      watercolorBlob(cx, cy, r, col, { layers: 4, deform: 0.55, seedOff: i*0.1+j*0.07 });
    }
  }
}

// -------- brush detail: short strokes simulating grass blades and shadow patches --------
function drawBrushDetail(){
  // shadow patches
  for (let k=0;k<240;k++){
    const x = random(width), y = random(height);
    const tone = noise(x*noiseScale, y*noiseScale);
    if (tone < 0.45) continue;
    const c = color(PALETTE.shadow); c.setAlpha(20);
    fill(c); noStroke();
    ellipse(x, y, 22 + rng()*30, 8 + rng()*14);
  }
  // grass dabs
  const dabs = 1100;
  for (let k=0;k<dabs;k++){
    const x = random(width), y = random(height);
    const tone = noise(x*noiseScale, y*noiseScale);
    if (tone < 0.45) continue;
    const ang = -PI/2 + (rng()-.5)*0.6;
    const len = 4 + rng()*7;
    const x2 = x + cos(ang)*len, y2 = y + sin(ang)*len;
    let col;
    const t = noise(x*0.01+50, y*0.01-50);
    if (t < .4) col = PALETTE.grass2;
    else if (t < .7) col = PALETTE.grass3;
    else col = PALETTE.grass4;
    brushStroke(x, y, x2, y2, col, 1.4 + rng()*1.0, 70 + rng()*60);
  }
}

// -------- trees: clusters of overlapping watercolor circles + ink trunk --------
function drawTrees(){
  const count = 70;
  for (let k=0;k<count;k++){
    const cx = random(width), cy = random(height);
    const tone = noise(cx*noiseScale, cy*noiseScale);
    if (tone < 0.5) continue;
    // cluster
    const clusters = 3 + floor(rng()*3);
    for (let q=0;q<clusters;q++){
      const ox = cx + (rng()-.5)*16;
      const oy = cy + (rng()-.5)*16;
      const r = 10 + rng()*16;
      const c = q===0 ? PALETTE.treeDk : (rng()<.5 ? PALETTE.treeMid : PALETTE.treeLi);
      watercolorBlob(ox, oy, r, c, { layers: 3, deform: 0.5, seedOff: q*0.3 });
    }
    // trunk hint
    stroke(PALETTE.trunk+'88'); strokeWeight(1.4);
    line(cx, cy+8, cx+(rng()-.5)*4, cy+18);
    noStroke();
    // tiny flower specks near tree base
    if (rng() < 0.5){
      for (let f=0;f<3;f++){
        const fx = cx + (rng()-.5)*30, fy = cy + 10 + rng()*16;
        const fc = rng()<.45 ? PALETTE.flowerY : (rng()<.5 ? PALETTE.flowerW : PALETTE.flowerR);
        fill(color(fc)); ellipse(fx, fy, 2.4, 2.4);
      }
    }
  }
}

// -------- ink contour lines (very faint) for that hand-drawn map feel --------
function drawInkContours(){
  // simple iso-lines via noise threshold sampling
  stroke(60, 50, 30, 24);
  strokeWeight(0.7);
  noFill();
  const step = 14;
  const thresholds = [0.4, 0.55, 0.7];
  for (const T of thresholds){
    beginShape();
    for (let y=0;y<height;y+=step){
      for (let x=0;x<width;x+=step){
        const n = noise(x*noiseScale, y*noiseScale);
        if (abs(n - T) < 0.012){
          point(x + (rng()-.5)*4, y + (rng()-.5)*4);
        }
      }
    }
    endShape();
  }
}

function draw(){
  // base paper
  background(PALETTE.paper);
  paperTexture();
  // washes
  drawGrassWashes();
  // rivers (1-2 of them)
  for (let i=0;i<2;i++) drawRiver();
  // brush detail
  drawBrushDetail();
  // ink contours
  drawInkContours();
  // trees on top
  drawTrees();
  // edge of canvas bleed
  noFill();
  for (let r=1;r<6;r++){
    stroke(80, 60, 30, 12);
    strokeWeight(1.5);
    rect(r*2, r*2, width-r*4, height-r*4);
  }
}

function windowResized(){
  resizeCanvas(window.innerWidth, window.innerHeight);
  redraw();
}

// Wire up
window.addEventListener('DOMContentLoaded', () => {
  regenerate(Math.floor(Math.random()*1e6));
});
document.getElementById('reseed').addEventListener('click', () => regenerate(Math.floor(Math.random()*1e6)));

/* ---------- Audio: ambient drone + gentle stream ---------- */
class Ambient {
  constructor(){ this.ac=null; this.master=null; this.muted=false; }
  start(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ac = new AC(); const ac = this.ac;
    this.master = ac.createGain(); this.master.gain.value = 0;
    this.master.connect(ac.destination);
    this.master.gain.linearRampToValueAtTime(0.5, ac.currentTime+1.4);

    // drone: 3 detuned sine layers low + reverb-ish delay
    const droneG = ac.createGain(); droneG.gain.value = 0.18;
    droneG.connect(this.master);
    [55, 82.5, 110].forEach((f, i) => {
      const o = ac.createOscillator(); o.type='sine';
      o.frequency.value = f * (1 + (Math.random()*.002 - .001));
      const g = ac.createGain(); g.gain.value = [0.7, 0.5, 0.35][i];
      // slow tremolo
      const lfo = ac.createOscillator(); lfo.frequency.value = 0.07 + i*0.04;
      const lfoG = ac.createGain(); lfoG.gain.value = 0.06;
      lfo.connect(lfoG).connect(g.gain); lfo.start();
      o.connect(g).connect(droneG); o.start();
    });
    // simple delay
    const delay = ac.createDelay(); delay.delayTime.value = 0.31;
    const fb = ac.createGain(); fb.gain.value = 0.35;
    droneG.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(this.master);

    // gentle stream
    const bs = 2 * ac.sampleRate;
    const wb = ac.createBuffer(1, bs, ac.sampleRate); const wd = wb.getChannelData(0); let last=0;
    for (let i=0;i<bs;i++){ const x=Math.random()*2-1; last=(last+0.02*x)/1.02; wd[i]=last*3.5; }
    const wsrc = ac.createBufferSource(); wsrc.buffer = wb; wsrc.loop = true;
    const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=720; bp.Q.value=.7;
    const wg = ac.createGain(); wg.gain.value = .28;
    const lfo2 = ac.createOscillator(); lfo2.frequency.value = .08;
    const lfo2G = ac.createGain(); lfo2G.gain.value = 240;
    lfo2.connect(lfo2G).connect(bp.frequency); lfo2.start();
    wsrc.connect(bp).connect(wg).connect(this.master); wsrc.start();
  }
  toggleMute(){ if(!this.ac)return; this.muted=!this.muted; this.master.gain.cancelScheduledValues(this.ac.currentTime); this.master.gain.linearRampToValueAtTime(this.muted?0:.5, this.ac.currentTime+.4); }
}
const ambient = new Ambient();
const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => { overlay.classList.add('hidden'); ambient.start(); });
document.getElementById('mute').addEventListener('click', e => { ambient.toggleMute(); e.target.textContent = ambient.muted ? 'unmute' : 'mute'; });
</script>
</body>
</html>
