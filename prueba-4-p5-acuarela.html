<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba 4 · p5.js acuarela</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4ead4; overflow:hidden; font-family: ui-monospace, Menlo, monospace; color:#3a3528; }
  canvas { display:block; }
  #overlay {
    position: fixed; inset: 0; background: rgba(244,234,212,.92); backdrop-filter: blur(4px);
    display: grid; place-items: center; cursor: pointer; z-index: 10; transition: opacity .4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay .card { text-align:center; padding:2rem 3rem; border:1px solid #b6a275; background:#fcf6ea; }
  #overlay h1 { margin:0 0 .8rem; font-size:1rem; letter-spacing:.2em; color:#5a4d2c; }
  #overlay p { margin:.2rem 0; font-size:.8rem; opacity:.7; }
  #hud { position: fixed; left:12px; bottom:10px; font-size:11px; opacity:.7; z-index:5; color:#5a4d2c; }
  #hud button { background:#fcf6ea; color:#5a4d2c; border:1px solid #b6a275; font:inherit; padding:4px 8px; margin-left:6px; cursor:pointer; }
  #hud button:hover { background:#eee2c8; }
</style>
</head>
<body>
<div id="overlay">
  <div class="card">
    <h1>PRUEBA 4 — ACUARELA</h1>
    <p>p5.js · pinceladas · ríos aguados</p>
    <p>click para empezar</p>
  </div>
</div>
<div id="hud">
  seed <span id="seedView">—</span>
  <button id="reseed">nuevo seed</button>
  <button id="mute">mute</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.10.0/lib/p5.min.js"></script>
<script>
/* ============================================================
   p5.js · ACUARELA · rebuild
   - Manchas de aguada superpuestas (low alpha, bordes jitterados)
   - Ríos como banda de bezier con bleed
   - Trazos cortos para texturizar la hierba
   - Árboles dibujados como acuarela + tinta ligera
   - Audio: ambient drone + corriente
   ============================================================ */

const PALETTE = {
  paper:    [244,234,212],
  paperDk:  [232,222,196],
  // grass tonal (light → dark)
  grass: [
    [180,200,140],
    [148,180,108],
    [104,156,84],
    [70,122,58],
    [42,84,42],
  ],
  // river
  riverDeep:[58,108,148],
  riverMid: [108,156,184],
  riverLite:[180,212,224],
  sand:     [220,196,138],
  sandDk:   [196,170,108],
  treeDk:   [34,70,30],
  treeMid:  [60,110,52],
  treeLi:   [110,160,82],
  trunk:    [76,52,32],
  flowerR:  [200,82,72],
  flowerY:  [220,182,76],
  flowerP:  [188,108,176],
  flowerW:  [248,242,224],
  ink:      [54,46,30],
};

let SEED = Math.floor(Math.random()*1e6);
function mulberry32(seed){ let s=seed>>>0; return () => { s=(s+0x6D2B79F5)|0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
let rng = mulberry32(SEED);

function setup(){
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  createCanvas(window.innerWidth, window.innerHeight);
  noLoop();
  noiseSeed(SEED);
  randomSeed(SEED);
  rng = mulberry32(SEED);
  document.getElementById('seedView').textContent = SEED;
  redraw();
}

function windowResized(){
  resizeCanvas(window.innerWidth, window.innerHeight);
  redraw();
}

function regenerate(s){
  SEED = s;
  noiseSeed(SEED);
  randomSeed(SEED);
  rng = mulberry32(SEED);
  document.getElementById('seedView').textContent = SEED;
  redraw();
}

/* ----- low-level utils ----- */
function rgba(arr, a){ return color(arr[0], arr[1], arr[2], a); }
function jitter(s){ return (rng()-0.5)*s; }

/* ----- paper texture + warm wash ----- */
function drawPaper(){
  background(PALETTE.paper);
  // overall slight warm wash
  noStroke();
  for (let k=0;k<6;k++){
    const a = 8;
    fill(232, 212, 168, a);
    rect(0, 0, width, height);
  }
  // soft grain (subtle)
  for (let k=0;k<3600;k++){
    const x = random(width), y = random(height);
    fill(120, 100, 60, 14);
    rect(x, y, 1.2, 1.2);
  }
  // edge darken
  noFill();
  for (let r=1;r<14;r++){
    stroke(120, 100, 60, 6);
    strokeWeight(2);
    rect(r*1.6, r*1.6, width-r*3.2, height-r*3.2);
  }
}

/* ----- soft watercolor blob: deformed polygon with multiple passes ----- */
function watercolorBlob(cx, cy, R, rgb, opts={}){
  const {
    layers = 4,
    deform = 0.45,
    verts = 28,
    edgeBleed = 1.18,
    a0 = 38,           // strongest pass alpha
    aFalloff = 0.55,   // alpha multiplier per pass
    seedOff = 0,
  } = opts;
  // base radii
  const baseR = [];
  for (let i=0;i<verts;i++){
    const a = (i/verts)*TWO_PI;
    const n = noise(cx*0.01 + cos(a)*0.5 + seedOff*7, cy*0.01 + sin(a)*0.5 + seedOff*7);
    baseR.push(R * (1 - deform*0.5 + n*deform));
  }
  // outer bleed (very light, slightly bigger)
  noStroke();
  fill(rgb[0], rgb[1], rgb[2], 14);
  beginShape();
  for (let i=0;i<verts;i++){
    const a = (i/verts)*TWO_PI;
    const j = (noise(cx*0.03+i*0.4+seedOff*3, cy*0.03+i*0.2)-0.5)*R*0.35;
    const r = baseR[i]*edgeBleed + j;
    vertex(cx + cos(a)*r, cy + sin(a)*r);
  }
  endShape(CLOSE);
  // main passes
  let aCurrent = a0;
  for (let L=0; L<layers; L++){
    fill(rgb[0], rgb[1], rgb[2], aCurrent);
    beginShape();
    for (let i=0;i<verts;i++){
      const a = (i/verts)*TWO_PI;
      const j = (noise(cx*0.02+L*7+i*0.4+seedOff*5, cy*0.02-L*3+i*0.2)-0.5)*R*0.18*(L+1);
      const r = baseR[i]*(1 - L*0.04) + j;
      vertex(cx + cos(a)*r, cy + sin(a)*r);
    }
    endShape(CLOSE);
    aCurrent = aCurrent * aFalloff;
  }
}

/* ----- short brush stroke (tapered curve) ----- */
function brushStroke(x, y, len, ang, rgb, w, a){
  push();
  translate(x, y);
  rotate(ang);
  stroke(rgb[0], rgb[1], rgb[2], a);
  strokeWeight(w);
  strokeCap(ROUND);
  noFill();
  beginShape();
  for (let i=0;i<=5;i++){
    const t = i/5;
    const px = lerp(0, len, t);
    const py = sin(t*PI)*w*0.5 + (rng()-.5)*0.6;
    curveVertex(px, py);
  }
  endShape();
  pop();
}

/* ----- BIG GRASS WASHES (5 tonal blobs of varying density) ----- */
function drawGrassWashes(){
  // 1) full-canvas pale wash (lightest)
  const w0 = PALETTE.grass[0];
  noStroke();
  fill(w0[0], w0[1], w0[2], 80);
  rect(0, 0, width, height);
  // 2) mid-tone blobs scattered (cluster by noise field)
  const cols = 7, rows = 5;
  const dw = width/cols, dh = height/rows;
  for (let j=0;j<rows;j++){
    for (let i=0;i<cols;i++){
      const cx = i*dw + dw*0.5 + jitter(dw*0.4);
      const cy = j*dh + dh*0.5 + jitter(dh*0.4);
      const n = noise(cx*0.0034, cy*0.0034);
      // determine grass tone level by noise band (skip lightest)
      let tone;
      if (n < 0.35) tone = 1;
      else if (n < 0.55) tone = 2;
      else if (n < 0.75) tone = 3;
      else tone = 4;
      const rgb = PALETTE.grass[tone];
      const R = (dw + dh)/2 * (0.55 + rng()*0.45);
      const alpha = tone === 1 ? 30 : tone === 2 ? 40 : tone === 3 ? 50 : 55;
      watercolorBlob(cx, cy, R, rgb, { layers: 3, deform: 0.55, a0: alpha, seedOff: i*0.13+j*0.07 });
    }
  }
}

/* ----- RIVER PATH via field-walk ----- */
function makeRiverPath(){
  const side = Math.floor(rng()*4);
  let x, y, dx, dy;
  if (side===0){ x=random(width); y=-25; dx=0; dy=1; }
  else if (side===1){ x=width+25; y=random(height); dx=-1; dy=0; }
  else if (side===2){ x=random(width); y=height+25; dx=0; dy=-1; }
  else { x=-25; y=random(height); dx=1; dy=0; }
  const path = [{x, y}];
  for (let s=0; s<320; s++){
    const ang = noise(x*0.003, y*0.003)*TWO_PI*2;
    const tx = cos(ang), ty = sin(ang);
    dx = lerp(dx, tx, 0.18);
    dy = lerp(dy, ty, 0.18);
    const m = sqrt(dx*dx+dy*dy)||1;
    dx /= m; dy /= m;
    x += dx * 11;
    y += dy * 11;
    path.push({x, y});
    if (x<-35 || y<-35 || x>width+35 || y>height+35) break;
  }
  return path;
}

function drawRiver(){
  const path = makeRiverPath();
  if (path.length < 4) return;
  noFill();
  // 1) far bleed (sandy) — wide, very low alpha
  stroke(PALETTE.sand[0], PALETTE.sand[1], PALETTE.sand[2], 30);
  strokeWeight(58);
  drawCurve(path, 4);
  // 2) shore (darker sand)
  stroke(PALETTE.sandDk[0], PALETTE.sandDk[1], PALETTE.sandDk[2], 55);
  strokeWeight(40);
  drawCurve(path, 3);
  // 3) water bleed (light)
  stroke(PALETTE.riverLite[0], PALETTE.riverLite[1], PALETTE.riverLite[2], 90);
  strokeWeight(28);
  drawCurve(path, 2);
  // 4) water mid
  stroke(PALETTE.riverMid[0], PALETTE.riverMid[1], PALETTE.riverMid[2], 130);
  strokeWeight(18);
  drawCurve(path, 1.6);
  // 5) deep core
  stroke(PALETTE.riverDeep[0], PALETTE.riverDeep[1], PALETTE.riverDeep[2], 165);
  strokeWeight(8);
  drawCurve(path, 1.0);
  // 6) wavelet whites
  noStroke();
  fill(255, 255, 255, 130);
  for (let i=2;i<path.length-2;i++){
    if (rng() > 0.55) continue;
    const p = path[i];
    ellipse(p.x + jitter(6), p.y + jitter(6), 3.5, 1.4);
  }
}

function drawCurve(path, wig){
  beginShape();
  curveVertex(path[0].x, path[0].y);
  for (const p of path){
    const jx = (noise(p.x*0.02, p.y*0.02)-0.5)*wig*3;
    const jy = (noise(p.x*0.02+9, p.y*0.02+9)-0.5)*wig*3;
    curveVertex(p.x+jx, p.y+jy);
  }
  curveVertex(path[path.length-1].x, path[path.length-1].y);
  endShape();
}

/* ----- grass brush dabs (texture) ----- */
function drawGrassDabs(){
  const N = 1400;
  for (let k=0;k<N;k++){
    const x = random(width), y = random(height);
    const n = noise(x*0.0034, y*0.0034);
    if (n < 0.32) continue;
    let tone;
    if (n < 0.5) tone = 2;
    else if (n < 0.7) tone = 3;
    else tone = 4;
    const rgb = PALETTE.grass[tone];
    const ang = -HALF_PI + jitter(0.5);
    const len = 3 + rng()*6;
    brushStroke(x, y, len, ang, rgb, 1 + rng()*0.8, 90 + rng()*60);
  }
}

/* ----- trees as cluster of watercolor blobs + trunk ----- */
function drawTrees(){
  // tree clusters gated by noise2
  const target = 70;
  let placed = 0; let attempts = 0;
  while (placed < target && attempts++ < 2500){
    const x = random(width), y = random(height);
    const n = noise(x*0.0034, y*0.0034);
    if (n < 0.48) continue;
    const cluster = 3 + Math.floor(rng()*3);
    for (let c=0;c<cluster;c++){
      const ox = x + jitter(18);
      const oy = y + jitter(18);
      const R = 12 + rng()*16;
      const rgbBase = c===0 ? PALETTE.treeDk : (rng()<.5 ? PALETTE.treeMid : PALETTE.treeLi);
      watercolorBlob(ox, oy, R, rgbBase, { layers: 3, deform: 0.5, a0: 60, seedOff: c*0.31+x*0.001 });
    }
    // ink trunk hint
    stroke(PALETTE.trunk[0], PALETTE.trunk[1], PALETTE.trunk[2], 150);
    strokeWeight(1.4);
    line(x, y+8, x + jitter(6), y + 22);
    noStroke();
    placed++;
  }
}

/* ----- flower specks ----- */
function drawFlowers(){
  const N = 280;
  for (let k=0;k<N;k++){
    const x = random(width), y = random(height);
    const n = noise(x*0.0034, y*0.0034);
    if (n < 0.4 || n > 0.74) continue;  // mid grass only
    const r = rng();
    const rgb = r<.32 ? PALETTE.flowerR : r<.62 ? PALETTE.flowerY : r<.85 ? PALETTE.flowerP : PALETTE.flowerW;
    noStroke();
    fill(rgb[0], rgb[1], rgb[2], 200);
    ellipse(x, y, 2.6, 2.6);
    // tiny halo
    fill(rgb[0], rgb[1], rgb[2], 60);
    ellipse(x, y, 5, 5);
  }
}

/* ----- ink contours (faint topo) ----- */
function drawInkContours(){
  noFill();
  const thresholds = [0.32, 0.5, 0.68];
  const step = 16;
  for (const T of thresholds){
    for (let y=0;y<height;y+=step){
      for (let x=0;x<width;x+=step){
        const n = noise(x*0.0034, y*0.0034);
        if (abs(n - T) < 0.012){
          stroke(PALETTE.ink[0], PALETTE.ink[1], PALETTE.ink[2], 32);
          strokeWeight(0.7);
          point(x + jitter(3), y + jitter(3));
        }
      }
    }
  }
}

function draw(){
  drawPaper();
  drawGrassWashes();
  drawRiver();
  drawGrassDabs();
  drawInkContours();
  drawTrees();
  drawFlowers();
}

/* ---------- Audio ---------- */
class Ambient {
  constructor(){ this.ac=null; this.master=null; this.muted=false; }
  start(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ac = new AC(); const ac = this.ac;
    this.master = ac.createGain(); this.master.gain.value=0;
    this.master.connect(ac.destination);
    this.master.gain.linearRampToValueAtTime(.5, ac.currentTime+1.4);
    // drone: 3 detuned sinewaves
    const droneG = ac.createGain(); droneG.gain.value = 0.18;
    droneG.connect(this.master);
    [55, 82.5, 110].forEach((f, i) => {
      const o = ac.createOscillator(); o.type='sine';
      o.frequency.value = f * (1 + (Math.random()*.002 - .001));
      const g = ac.createGain(); g.gain.value = [0.7, 0.5, 0.35][i];
      const lfo = ac.createOscillator(); lfo.frequency.value = 0.07 + i*0.04;
      const lfoG = ac.createGain(); lfoG.gain.value = 0.06;
      lfo.connect(lfoG).connect(g.gain); lfo.start();
      o.connect(g).connect(droneG); o.start();
    });
    const delay = ac.createDelay(); delay.delayTime.value = 0.31;
    const fb = ac.createGain(); fb.gain.value = 0.35;
    droneG.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(this.master);
    // gentle stream
    const bs = 2 * ac.sampleRate;
    const wb = ac.createBuffer(1, bs, ac.sampleRate); const wd = wb.getChannelData(0); let last=0;
    for (let i=0;i<bs;i++){ const x=Math.random()*2-1; last=(last+0.02*x)/1.02; wd[i]=last*3.5; }
    const wsrc = ac.createBufferSource(); wsrc.buffer = wb; wsrc.loop = true;
    const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=720; bp.Q.value=.7;
    const wg = ac.createGain(); wg.gain.value = .28;
    const lfo2 = ac.createOscillator(); lfo2.frequency.value = .08;
    const lfo2G = ac.createGain(); lfo2G.gain.value = 240;
    lfo2.connect(lfo2G).connect(bp.frequency); lfo2.start();
    wsrc.connect(bp).connect(wg).connect(this.master); wsrc.start();
  }
  toggleMute(){ if(!this.ac)return; this.muted=!this.muted; this.master.gain.cancelScheduledValues(this.ac.currentTime); this.master.gain.linearRampToValueAtTime(this.muted?0:.5, this.ac.currentTime+.4); }
}
const ambient = new Ambient();
const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => { overlay.classList.add('hidden'); ambient.start(); });
document.getElementById('mute').addEventListener('click', e => { ambient.toggleMute(); e.target.textContent = ambient.muted ? 'unmute' : 'mute'; });
document.getElementById('reseed').addEventListener('click', () => regenerate(Math.floor(Math.random()*1e6)));
</script>
</body>
</html>
